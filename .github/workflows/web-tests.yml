# Web UI test suite — Vitest unit + Playwright e2e + screenshot regression.
#
# Triggered on any change that could affect the rendered UI or the parity
# contract documented in tests/web/PARITY_MATRIX.md.
#
# See documentation/webui-overhaul-plan.md for context on why this suite
# exists. Failure modes it defends against:
#   1. Visual regression — unintended pixel diffs against baselines.
#   2. State drift — web sees something the TUI doesn't, or vice versa.
#   3. Parity-matrix gap — a documented MISSING action quietly gets added
#      via the web without updating the matrix.

name: Web tests

on:
  pull_request:
    paths:
      - 'internal/web/**'
      - 'cmd/agent-deck/web_cmd.go'
      - 'tests/web/**'
      - 'documentation/webui-overhaul-plan.md'
      - '.github/workflows/web-tests.yml'
      - 'Makefile'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch: {}
  # Nightly backstop (post-tag CI queue): the PR trigger above stays
  # path-filtered; this run covers changes that reach this code from
  # outside those paths.
  schedule: [{ cron: '40 3 * * *' }]

# Every job here builds or launches the agent-deck binary. Since v1.16.7 a
# TUI or daemon installs a newer release on its own and restarts in place;
# a release landing mid-run must never hijack a test (issue #2251). The
# binary also refuses under go test, CI=true and without a TTY, this is the
# one switch that covers every spawn in this workflow.
env:
  AGENTDECK_SKIP_UPDATE_CHECK: "1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: vitest (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/web/package-lock.json

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Run Vitest
        run: npm run test:unit

  e2e:
    name: playwright (e2e + screenshots) [${{ matrix.shard }}/4]
    # Pinned: ubuntu-latest moved to 26.04, which Playwright's chromium
    # install (--with-deps) does not support yet. Move back once it does.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The suite runs with workers: 1 against one fixture server, so one job
    # spent ~8-10 min in serial test time. Playwright's own --shard splits
    # the same test list (every project, every spec) across four runners,
    # each with its own fixture server; nothing is skipped or selected, and
    # a spec or project added later lands in a shard by itself. The
    # "playwright (e2e + screenshots)" job below keeps the old check name
    # and fails unless every shard passed.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: tests/web
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tests/web/package-lock.json

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-${{ hashFiles('tests/web/package-lock.json') }}
          restore-keys: playwright-ubuntu-

      - name: Install Playwright (chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build fixture binary
        working-directory: .
        env:
          GOTOOLCHAIN: go1.26.11
        run: go build -o tests/web/.tmp/web-fixture ./tests/web/fixtures/cmd/web-fixture/

      - name: Run Playwright e2e
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4

      # On failure, upload the screenshot diffs and HTML report so reviewers
      # can see what changed without reproducing locally.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-${{ matrix.shard }}
          path: tests/web/playwright-report
          retention-days: 14

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-screenshots-${{ matrix.shard }}
          path: tests/web/e2e-output
          retention-days: 14

  # Same check name as the single e2e job had before the split, so anything
  # that watches it still sees one result. Fails unless every shard passed
  # (a failed, skipped or cancelled shard fails it).
  e2e-gate:
    name: playwright (e2e + screenshots)
    needs: e2e
    # !cancelled(): a superseded run (cancel-in-progress) stays cancelled
    # instead of reporting a red gate; any other shard outcome reaches it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on shard results
        run: |
          echo "e2e shards: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] || { echo "An e2e shard failed, was cancelled or did not run."; exit 1; }

  parity-go:
    name: go parity (web vs mutator)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run TestParity_*
        env:
          GOTOOLCHAIN: go1.26.11
        run: go test ./internal/web/ -run TestParity -race -count=1
