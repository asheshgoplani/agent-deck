name: Status pass Docker regression

on:
  pull_request:
    branches: [main]
    paths:
      - internal/session/codex_exclusion_cache.go
      - internal/session/codex_status_pass_regression_test.go
      - internal/ui/status_pass_sweep_test.go
      - scripts/ci/status-pass-*
      - .github/workflows/status-pass-regression.yml

permissions:
  contents: read

concurrency:
  group: status-pass-regression-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  receipts:
    if: github.head_ref == 'fix/status-loop-codex-scan-2284'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Reproduce base, reviewed-head, and fixed-head evidence
        run: scripts/ci/status-pass-regression.sh "$RUNNER_TEMP/status-pass-receipts"
      - name: Preserve raw receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: status-pass-receipts
          path: ${{ runner.temp }}/status-pass-receipts/*.log
