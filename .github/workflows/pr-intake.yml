name: PR Intake Gate

# Required status check on PR description format. The `main-protection`
# ruleset lists the `intake` job id as a required context, so no PR can merge
# until this job has reported on its current tip. Do not rename the `intake`
# job id. The job exits green in both outcomes; a body that misses the contract
# in .github/INTAKE.md is surfaced by the `needs-info` label and the comment,
# not by a red check.
#
# What it does: reads the PR body against .github/INTAKE.md, applies the
# `intake:clean` or `needs-info` label, and posts ONE kind comment explaining
# what is missing. It never closes the PR, never requests changes, and never
# touches PR code. The visible template sections are authoritative; the
# trailing gate marker is a parse-stable confirmation.
#
# Security posture: pull_request_target runs in the base-repo context (needed to
# label/comment on fork PRs), so this job is metadata-only. It never checks out,
# builds, or runs any PR code — it reads only the PR body via the API. Do not add
# a checkout of the head ref here.

on:
  pull_request_target:
    # synchronize/reopened matter because the ruleset requires `intake` on the
    # CURRENT tip: without them, any PR whose last event was a push could never
    # satisfy the merge gate (observed on real PRs blocked indefinitely).
    types: [opened, edited, ready_for_review, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-intake-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  intake:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    timeout-minutes: 10
    steps:
      - name: Evaluate intake contract
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const MARKER = '<!-- pr-intake-gate -->';
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const number = pr.number;
            const body = (pr.body || '').replace(/\r\n?/g, '\n');
            const assoc = pr.author_association || '';
            const login = (pr.user && pr.user.login) || '';
            // Maintainer and bot PRs: the contract is still evaluated and logged as
            // a notice, but they never get `needs-info` or the contributor comment.
            const exempt = ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc) ||
              (pr.user && pr.user.type === 'Bot') || login.endsWith('[bot]');
            // A maintainer `bad-gate` label overrides intake: labels and comment
            // are left exactly as they are on every re-run.
            const overridden = (pr.labels || []).some(l => l.name === 'bad-gate');
            // GitHub holds fork CI for these until a maintainer approves the runs.
            const firstTimer = ['FIRST_TIME_CONTRIBUTOR', 'FIRST_TIMER', 'NONE'].includes(assoc);

            // ---- Contract, from .github/INTAKE.md ----
            const requiredHeadings = [
              'What problem does this solve?',
              'Why this change',
              'User impact',
              'AI disclosure',
              'What actually bothered you',
              'Checklist',
            ];

            // Tolerant heading parse. A heading is #, ## or ### at line start; its
            // text is compared lowercased with punctuation and emoji dropped, so
            // `### Why this change?` and `## AI disclosure:` match. Lines inside
            // ``` or ~~~ fences are never headings. A section runs to the next
            // heading of the same or a higher level, so ### sub-headings stay in
            // their ## section and an empty section never borrows the next one.
            const norm = s => s.toLowerCase().replace(/[^\p{L}\p{N} ]+/gu, ' ').replace(/\s+/g, ' ').trim();
            const requiredKeys = new Set(requiredHeadings.map(norm));
            const parsed = [];
            {
              let fence = null;
              for (const line of body.split('\n')) {
                // A fence closes only on the same character, at least as long as
                // the opener, so ```` can wrap an example that contains ```.
                const f = line.match(/^\s{0,3}(`{3,}|~{3,})/);
                if (f) {
                  if (!fence) fence = f[1];
                  else if (f[1][0] === fence[0] && f[1].length >= fence.length) fence = null;
                }
                // `##Checklist` (no space) counts only for a contract heading, so a
                // line like `#2531` is never taken for a heading.
                const h = !fence && !f && line.match(/^\s{0,3}(#{1,3})(\s*)(.+?)\s*#*\s*$/);
                const key = h ? norm(h[3]) : '';
                if (h && key && (h[2] || requiredKeys.has(key))) {
                  parsed.push({ level: h[1].length, key, lines: [] });
                } else if (parsed.length) {
                  parsed[parsed.length - 1].lines.push(line);
                }
              }
            }
            // Body of the first section with this heading, or null when the heading
            // is absent or its body is only whitespace.
            function section(heading) {
              const want = norm(heading);
              const i = parsed.findIndex(p => p.key === want);
              if (i < 0) return null;
              const out = [...parsed[i].lines];
              for (let j = i + 1; j < parsed.length && parsed[j].level > parsed[i].level; j++) {
                out.push('#'.repeat(parsed[j].level) + ' ' + parsed[j].key, ...parsed[j].lines);
              }
              const text = out.join('\n');
              return text.trim() ? text : null;
            }
            // Strip HTML comments + whitespace-only lines to test for real content.
            function meaningful(text) {
              if (!text) return false;
              const stripped = text
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/^\s*[-*+]\s*\[[ xX]\]/gm, '') // checklist boxes are not "content" for intent
                .replace(/^#{1,3} .*$/gm, '') // nor is a bare sub-heading with nothing under it
                .trim();
              return stripped.length > 0;
            }

            const findings = [];

            // 1) Required headings present with content. The intent section has its
            // own finding below, so it is not listed here as well.
            const INTENT = 'What actually bothered you';
            const missingHeadings = requiredHeadings.filter(h => h !== INTENT && section(h) === null);
            if (missingHeadings.length) {
              findings.push('Missing required section' + (missingHeadings.length > 1 ? 's' : '') +
                ': ' + missingHeadings.map(h => '`## ' + h + '`').join(', ') + '.');
            }

            // 2) Exactly one AI-disclosure box checked.
            const aiSection = section('AI disclosure') || '';
            const checkedBoxes = (aiSection.match(/^\s*[-*+]\s*\[[xX]\]/gm) || []).length;
            let aiKind = null; // authored | assisted | human
            if (checkedBoxes === 1) {
              const line = (aiSection.match(/^\s*[-*+]\s*\[[xX]\].*$/m) || [''])[0].toLowerCase();
              if (line.includes('authored')) aiKind = 'authored';
              else if (line.includes('assisted')) aiKind = 'assisted';
              else if (line.includes('human')) aiKind = 'human';
            }
            if (checkedBoxes === 0) {
              findings.push('No AI-disclosure box is checked — pick exactly one (Human-written / AI-assisted / AI-authored). AI is welcome here with equal standing; this is a signal, not a filter.');
            } else if (checkedBoxes > 1) {
              findings.push('More than one AI-disclosure box is checked — pick exactly one.');
            }

            // 3) Human intent non-empty.
            if (!meaningful(section(INTENT))) {
              findings.push('`## What actually bothered you` is missing or empty — one real sentence of human intent is the one field intake cannot accept blank. If an agent opened this PR, quote what the human asked for.');
            }

            // Parse the optional trailing marker (informational only).
            const marker = body.match(/<!--\s*gate:ai=([^\s]+)\s+model=([^\s]+)\s+intent=([^\s]+)\s*-->/i);
            const markerInfo = marker ? { ai: marker[1], model: marker[2], intent: marker[3] } : null;

            const clean = findings.length === 0;

            // ---- Labels (add/remove so re-edits converge) ----
            const current = new Set((pr.labels || []).map(l => l.name));
            const want = new Set();
            const drop = new Set();

            if (overridden) {
              core.info('bad-gate label present: intake labels and comment left as they are (' +
                (clean ? 'clean' : findings.length + ' finding(s)') + ')');
              return;
            }

            if (clean) { want.add('intake:clean'); drop.add('needs-info'); }
            else if (exempt) { drop.add('needs-info'); drop.add('intake:clean'); }
            else { want.add('needs-info'); drop.add('intake:clean'); }

            if (aiKind === 'authored') { want.add('ai-authored'); drop.add('ai-assisted'); }
            else if (aiKind === 'assisted') { want.add('ai-assisted'); drop.add('ai-authored'); }

            for (const name of want) {
              if (!current.has(name)) {
                try { await github.rest.issues.addLabels({ owner, repo, issue_number: number, labels: [name] }); }
                catch (e) { core.warning('addLabel ' + name + ': ' + e.message); }
              }
            }
            for (const name of drop) {
              if (current.has(name)) {
                try { await github.rest.issues.removeLabel({ owner, repo, issue_number: number, name }); }
                catch (e) { core.warning('removeLabel ' + name + ': ' + e.message); }
              }
            }

            if (exempt) {
              core.notice('Intake advisory for ' + (assoc || 'bot') + ' author ' + login + ': ' +
                (clean ? 'clean.' : findings.join(' ')));
              return;
            }

            // ---- One kind comment (create, then update in place on re-edits) ----
            let comment;
            if (clean) {
              comment = [
                '👋 Thanks for the contribution — intake looks complete.',
                '',
                'Your PR body carries everything the maintainer\'s validation pipeline reads first: the problem, the reasoning, the human intent behind it, and an AI-disclosure. It will be applied, built, and tested against `main`, and you\'ll get a structured result within about a day. Merges are always human.',
              ].join('\n');
            } else {
              comment = [
                '👋 Thanks for opening this — a couple of intake fields would help the maintainer\'s validation pipeline (and any reviewer) understand it faster. Nothing here blocks you and nothing is closing: this is a heads-up, and editing the description re-runs this check automatically.',
                '',
                ...findings.map(f => '- ' + f),
                '',
                'The full field-level contract is in [.github/INTAKE.md](https://github.com/' + owner + '/' + repo + '/blob/main/.github/INTAKE.md). AI-authored PRs are welcome here with equal standing.',
              ].join('\n');
            }
            if (markerInfo) {
              comment += '\n\n<sub>gate marker read: ai=`' + markerInfo.ai + '` model=`' + markerInfo.model + '` intent=`' + markerInfo.intent + '`</sub>';
            }
            if (firstTimer) {
              comment += '\n\nBecause this is your first contribution here, GitHub holds the CI runs until a maintainer approves them, so the checks will show as waiting until then. You do not need to do anything.';
            }
            comment += '\n\n' + MARKER;

            const existing = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const mine = existing.find(c => (c.body || '').includes(MARKER) &&
              (c.user.type === 'Bot' || c.user.login === 'github-actions[bot]'));

            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body: comment });
            }

            core.info('Intake ' + (clean ? 'clean' : 'needs-info: ' + findings.length + ' finding(s)'));
