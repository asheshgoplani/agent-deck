# Automated release via GoReleaser when a version tag is pushed.
# Replaces the manual `make release-local` step that was previously
# required after tagging, preventing empty releases (see #332).

name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual escape hatch. A standalone tag re-push does not reliably re-fire
  # the tag-push event when the ref->SHA mapping is unchanged (GitHub
  # suppresses the duplicate event), which left v1.9.36 tagged but never
  # published. Dispatch this against `main` with the tag to publish, e.g.
  # `gh workflow run release.yml --ref main -f tag=v1.9.36`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v1.9.36). Must already exist.'
        required: true
        type: string

# Serialize publish per tag. If a duplicate run is queued for the same tag
# (e.g. local worker accidentally re-publishes), goreleaser would race with
# itself and the second uploader would 422 already_exists on each of the 5
# assets (the v1.9.0-v1.9.5 race).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Sigstore OIDC + GitHub artifact attestation (SLSA build provenance).
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Tag-push runs use the pushed tag; manual dispatch supplies it explicitly.
    env:
      REF_NAME: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Check out the tag itself so GoReleaser sees the version tag at HEAD,
          # even when dispatched against main.
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      # #1759: the empty-release window. If a release already exists for this
      # tag and is already published (an out-of-band `gh release create`, or a
      # previous run of this workflow), GoReleaser will NOT re-draft it —
      # createOrUpdateRelease copies the existing release's draft flag — so it
      # would stay public and asset-less for the ~11 minutes of tests + build
      # that follow. `agent-deck update` then errors with "no release binary
      # available" and homebrew-verify red-fails on the mismatch.
      #
      # Force the invariant this pipeline depends on: when GoReleaser starts,
      # the release for this tag either does not exist or is an unpublished
      # draft. Publishing happens in exactly one place — the "Publish release"
      # step below, after assets are verified. This runs before Go setup so the
      # exposure window is seconds, not minutes.
      #
      # Re-drafting is non-destructive: the tag and any already-uploaded assets
      # survive, and /releases/latest falls back to the previous good release,
      # which is precisely the behaviour we want while a release is in flight.
      - name: Force incomplete pre-existing release back to draft
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"

          # `gh release view` resolves drafts too — it falls back to a draft
          # lookup when the by-tag endpoint 404s — so "no release", "draft" and
          # "published" are all distinguishable here.
          if ! payload=$(gh release view "${REF_NAME}" --repo "${REPO}" --json isDraft,assets 2>/dev/null); then
            echo "No release exists yet for ${REF_NAME} — GoReleaser will create it as a draft."
            exit 0
          fi
          if [[ "$(jq -r '.isDraft' <<<"${payload}")" == "true" ]]; then
            echo "Release ${REF_NAME} already exists as a draft — GoReleaser will adopt it."
            exit 0
          fi

          # Keep this list in lockstep with "Validate release assets" below and
          # with .goreleaser.yml's archive matrix.
          EXPECTED=(
            "agent-deck_${VERSION}_darwin_amd64.tar.gz"
            "agent-deck_${VERSION}_darwin_arm64.tar.gz"
            "agent-deck_${VERSION}_linux_amd64.tar.gz"
            "agent-deck_${VERSION}_linux_arm64.tar.gz"
            "checksums.txt"
          )
          ASSETS=$(jq -r '.assets[].name' <<<"${payload}")
          MISSING=()
          for asset in "${EXPECTED[@]}"; do
            if ! grep -qx -- "${asset}" <<<"${ASSETS}"; then
              MISSING+=("${asset}")
            fi
          done

          if [[ ${#MISSING[@]} -eq 0 ]]; then
            # A published release that already carries every asset is a finished
            # release. Rebuilding it would delete and re-upload live assets,
            # re-opening the very window this workflow exists to close, so stop
            # instead. This is the mis-dispatch guard: re-running against an old
            # complete tag must never disturb it.
            echo "ERROR: release ${REF_NAME} is already published with all ${#EXPECTED[@]} assets."
            echo "Nothing to do — refusing to rebuild and re-upload assets of a live release."
            echo "To genuinely redo this release, delete the GitHub release first (the tag can stay),"
            echo "then re-run this workflow."
            exit 1
          fi

          echo "WARNING: release ${REF_NAME} is PUBLISHED but incomplete — missing:"
          for m in "${MISSING[@]}"; do echo "  - ${m}"; done
          echo "Reverting it to a draft so nobody observes an asset-less release (#1759)."
          echo "Release cuts must push the tag only; never create the release published."
          # The title is normalised to the tag on purpose: GoReleaser's
          # use_existing_draft lookup matches a draft by release NAME (its
          # findDraftRelease compares GetName(), while the caller passes the tag),
          # so a release someone created with a custom title would be invisible to
          # it and the run would collide on the tag instead of adopting the draft.
          # .goreleaser.yml's name_template is "v{{.Version}}", i.e. exactly the tag.
          gh release edit "${REF_NAME}" --repo "${REPO}" --draft=true --title "${REF_NAME}"
          echo "Release ${REF_NAME} is now an unpublished draft titled ${REF_NAME}."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod
          # Disable the module cache in this write-permission workflow: a
          # poisoned cache entry could otherwise influence the very build we
          # then sign provenance for.
          cache: false

      - name: Validate tag matches code version
        run: |
          TAG="${REF_NAME#v}"
          CODE=$(grep 'var Version' cmd/agent-deck/main.go | head -1 | sed 's/.*= "\([^"]*\)".*/\1/')
          if [ "$TAG" != "$CODE" ]; then
            echo "ERROR: Tag v$TAG does not match code Version $CODE"
            exit 1
          fi
          echo "Version: $CODE"

      # zoxide backs the quick-open picker tests (#693, v1.7.54). Not on
      # ubuntu-latest by default; install here so `go test ./...` doesn't
      # false-fail on the non-title-lock zoxide_picker_test suite.
      - name: Install zoxide
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y zoxide
          zoxide --version

      - name: Install gotestsum
        timeout-minutes: 5
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run tests
        timeout-minutes: 30
        env:
          PERF_BUDGET_MULTIPLIER: '2.0'
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          PACKAGES=$(go list ./... | grep -v -E 'internal/(tmux|integration|tuitest)$')
          gotestsum --rerun-fails=2 --rerun-fails-abort-on-data-race --packages="$PACKAGES" -- -race -timeout 20m

      - name: Run integration tests (informational)
        timeout-minutes: 15
        continue-on-error: true
        run: go test -race -timeout 10m -tags integration ./internal/tmux/... ./internal/integration/... ./internal/tuitest/... ./internal/mcppool/...

      # Evaluator harness full tier. Blocking — a release that fails eval
      # does not get a tag. See docs/rfc/EVALUATOR_HARNESS.md (#37).
      # Until `eval_full` cases exist, this runs the eval_smoke suite with
      # a longer timeout so smoke coverage is enforced at the release gate
      # too, not just on PRs.
      - name: Run eval harness (full tier)
        timeout-minutes: 10
        env:
          GOTOOLCHAIN: go1.25.12
        run: |
          go test -tags 'eval_smoke eval_full' -race -count=1 -timeout 6m ./tests/eval/... ./internal/ui/...

      - name: Run GoReleaser
        timeout-minutes: 15
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Validate release assets
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${REF_NAME#v}"
          echo "Validating assets for release ${REF_NAME} (version ${VERSION})..."

          # The release is still a draft at this point (#1759), and
          # /releases/tags/{tag} only resolves PUBLISHED releases — it would
          # 404 here. `gh release view` falls back to a draft lookup, so it
          # works for both.
          ASSETS=$(gh release view "${REF_NAME}" --repo "${REPO}" --json assets --jq '.assets[].name')

          EXPECTED=(
            "agent-deck_${VERSION}_darwin_amd64.tar.gz"
            "agent-deck_${VERSION}_darwin_arm64.tar.gz"
            "agent-deck_${VERSION}_linux_amd64.tar.gz"
            "agent-deck_${VERSION}_linux_arm64.tar.gz"
          )

          MISSING=()
          for asset in "${EXPECTED[@]}"; do
            if ! echo "$ASSETS" | grep -qx "$asset"; then
              MISSING+=("$asset")
            fi
          done

          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "ERROR: The following expected release assets are missing:"
            for m in "${MISSING[@]}"; do
              echo "  - $m"
            done
            echo ""
            echo "All available assets:"
            echo "$ASSETS"
            exit 1
          fi

          # Also verify checksums.txt is present
          if ! echo "$ASSETS" | grep -qx "checksums.txt"; then
            echo "ERROR: checksums.txt is missing from the release assets"
            exit 1
          fi

          ASSET_COUNT=$(echo "$ASSETS" | wc -l | tr -d ' ')
          echo "All ${#EXPECTED[@]} platform tarballs and checksums.txt verified successfully."
          echo "Total assets in release: ${ASSET_COUNT}"

      # SLSA build provenance: attest the published artifacts so consumers can
      # cryptographically verify they were built by this repo's CI from the
      # tagged source (`gh attestation verify`, see SECURITY.md).
      #
      # An attestation is a SIGNED claim — attesting an incomplete or corrupt
      # set is worse than not attesting, because consumers trust it. So this
      # step downloads every expected artifact, fails the moment any single
      # download fails or yields an empty file, verifies each tarball against
      # the published SHA-256 checksum, and asserts an exact artifact count
      # BEFORE the attest step runs. Anything off → fail closed, no signature.
      - name: Download and verify release artifacts for attestation
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          mkdir -p dist-attest

          # Keep in lockstep with the EXPECTED list in "Validate release
          # assets" above and with .goreleaser's archive matrix.
          ARTIFACTS=(
            "agent-deck_${VERSION}_darwin_amd64.tar.gz"
            "agent-deck_${VERSION}_darwin_arm64.tar.gz"
            "agent-deck_${VERSION}_linux_amd64.tar.gz"
            "agent-deck_${VERSION}_linux_arm64.tar.gz"
          )

          # Download each artifact (plus checksums.txt) one at a time, checking
          # each individually. A loop without these checks could attest a
          # partial set — the #1159 defect this step exists to prevent.
          for asset in "${ARTIFACTS[@]}" "checksums.txt"; do
            echo "Downloading ${asset}..."
            if ! gh release download "${REF_NAME}" \
                --repo "${REPO}" \
                --pattern "${asset}" \
                --dir dist-attest; then
              echo "ERROR: failed to download ${asset} for attestation — failing closed"
              exit 1
            fi
            if [[ ! -s "dist-attest/${asset}" ]]; then
              echo "ERROR: ${asset} is missing or empty after download — failing closed"
              exit 1
            fi
          done

          # Verify every downloaded tarball against the published checksum
          # before attesting. We filter checksums.txt to the assets we hold so
          # that unrelated entries don't make `sha256sum -c` fail on a missing
          # file, and we fail closed if any expected entry is absent.
          echo "Verifying SHA-256 checksums..."
          (
            cd dist-attest
            for asset in "${ARTIFACTS[@]}"; do
              if ! line=$(grep -- "  ${asset}$" checksums.txt); then
                echo "ERROR: ${asset} has no entry in checksums.txt — failing closed"
                exit 1
              fi
              echo "${line}" | sha256sum -c -
            done
          )

          # Final guard: exactly the platform tarballs + checksums.txt, nothing
          # missing and nothing extra, before we hand the directory to attest.
          EXPECTED_COUNT=$(( ${#ARTIFACTS[@]} + 1 ))
          ACTUAL_COUNT=$(find dist-attest -maxdepth 1 -type f | wc -l | tr -d ' ')
          if [[ "${ACTUAL_COUNT}" -ne "${EXPECTED_COUNT}" ]]; then
            echo "ERROR: expected ${EXPECTED_COUNT} artifacts to attest, found ${ACTUAL_COUNT} — failing closed"
            find dist-attest -maxdepth 1 -type f
            exit 1
          fi
          echo "Verified ${#ARTIFACTS[@]} tarballs against checksums.txt; ready to attest."

      # The single place a release becomes visible (#1759). Everything above has
      # to have passed: GoReleaser succeeded, the four tarballs and
      # checksums.txt are attached, and every tarball's SHA-256 matches the
      # published checksum. Only then does the release leave draft.
      #
      # If any earlier step fails the draft is simply never published:
      # /releases/latest keeps pointing at the last good release, so
      # `agent-deck update` and Homebrew never observe an asset-less release.
      # The leftover draft is picked up and reused by the next run of this
      # workflow for the same tag (release.use_existing_draft).
      - name: Publish release
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Publishing verified release ${REF_NAME}..."

          # prerelease: auto in .goreleaser.yml keys off a pre-release suffix in
          # the tag; mirror that here so an rc/beta tag is not promoted to
          # "latest" on the releases page or the /releases/latest endpoint.
          if [[ "${REF_NAME}" == *-* ]]; then
            echo "Tag ${REF_NAME} carries a pre-release suffix — publishing as a pre-release, not latest."
            gh release edit "${REF_NAME}" --repo "${REPO}" --draft=false --prerelease
          else
            gh release edit "${REF_NAME}" --repo "${REPO}" --draft=false --latest
          fi

          # Confirm the state we intended actually landed, so a silent no-op
          # cannot masquerade as a successful publish.
          IS_DRAFT=$(gh release view "${REF_NAME}" --repo "${REPO}" --json isDraft --jq '.isDraft')
          if [[ "${IS_DRAFT}" != "false" ]]; then
            echo "ERROR: release ${REF_NAME} is still a draft after publish — failing closed"
            exit 1
          fi
          echo "Release ${REF_NAME} is published with all assets attached."

      - name: Attest build provenance
        timeout-minutes: 10
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: 'dist-attest/*'

      - name: Notify on failure
        if: failure()
        timeout-minutes: 2
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          REF_NAME: ${{ env.REF_NAME }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail --show-error --silent \
            --connect-timeout 5 \
            --max-time 15 \
            -H "Title: Release ${REF_NAME} failed" \
            -H "Priority: high" \
            -H "Tags: github,release,failure" \
            -d "Release workflow failed for ${REF_NAME}. The release stays an unpublished draft, so updaters and Homebrew still see the previous good release; re-run this workflow to retry. Check logs: ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}"
