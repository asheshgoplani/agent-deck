# Full Go test suite as a PR gate (#1363, proposed by @spawnia).
#
# Why this exists: the per-package PR smoke gates (perf-smoke,
# session-persistence, eval-smoke, golangci-lint) each run a SUBSET of the
# suite, so a regression that only manifests when the WHOLE suite runs
# together — shared global state, cross-package ordering, data races surfaced
# only under `-race ./...` — slips past PR review and is caught for the first
# time at the release gate. That happened four times: it broke the
# v1.9.49 / v1.9.50 / v1.9.51 / v1.9.53 releases.
#
# This workflow closes that gap by running the EXACT proven release-gate test
# step (release.yml "Run tests") on every PR, so full-suite-only regressions
# fail at PR time instead of blocking a release.
#
# Steel-thread parity: the toolchain setup, the zoxide dependency, the
# PERF_BUDGET_MULTIPLIER env, and the gotestsum invocation are copied verbatim
# from .github/workflows/release.yml. Keep them in lockstep — if the release
# gate's test step changes, mirror it here.

name: Go tests

on:
  # No paths filter on pull_request: `Full test suite (PR gate)` is a REQUIRED
  # check, and a path-filtered required check simply never reports on (e.g.)
  # docs-only PRs, blocking their merge forever. The job instead short-circuits
  # cheaply when the diff touches nothing Go-related.
  pull_request:
  push:
    branches:
      - main
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/go-test.yml'
      - 'scripts/ci-native-ssh.sh'
      - 'scripts/ci-shared-state-proof.sh'
      - 'scripts/ci-test-summary.py'
      - 'tests/known-flaky.txt'
      - 'tests/ci/ci-test-summary.test.sh'
      - 'tests/comms_matrix/**'
      - '.github/workflows/comms-matrix.yml'
      - 'sandbox/Dockerfile'
      - '.github/scripts/version-only-diff.sh'
      - 'tests/ci/version-only-diff.test.sh'

# One in-flight run per PR (or per branch on push). Rapid follow-up pushes
# cancel the stale run instead of stacking 20-minute jobs.
# Every job here builds or launches the agent-deck binary. Since v1.16.7 a
# TUI or daemon installs a newer release on its own and restarts in place;
# a release landing mid-run must never hijack a test (issue #2251). The
# binary also refuses under go test, CI=true and without a TTY, this is the
# one switch that covers every spawn in this workflow.
env:
  AGENTDECK_SKIP_UPDATE_CHECK: "1"

concurrency:
  group: go-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  comms-matrix:
    # Advisory for the first week; promote only after clean real-PR runs.
    # advisory: true keeps a failing rig leg from turning the whole Go tests
    # run red; the leg reports a warning in its summary instead.
    name: Comms matrix advisory
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/comms-matrix.yml
    with:
      advisory: true

  # Docs-only PRs still need the required check to REPORT, but running the
  # full race suite for a README tweak is waste. Decide once here; the shards,
  # the gate, the comms matrix and the native SSH jobs read the answer. The
  # pattern mirrors the push paths list above.
  #
  # It also spots a version-only release PR (ASK-161, #2929): the diff
  # touches only CHANGELOG.md and the single `var Version = "X.Y.Z"` line of
  # cmd/agent-deck/main.go (parsed from the patch), and the PR's base sha
  # already has a successful push "Go tests" run on main in which every
  # shard passed. The PR tree is then that green tree plus one string
  # constant, so the shards are skipped and the "Version-only release check"
  # job (build, vet, version and release tests) gates it instead. Anything
  # else, or any API error, means version_only=false and the full shards.
  # The tag sha's own push run below still runs the whole suite.
  changes:
    name: Detect Go-relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lets the read-only GITHUB_TOKEN look up the base sha's
    # push run. No secret is used, so fork PRs take the same path.
    permissions:
      contents: read
      actions: read
    outputs:
      go: ${{ steps.gochanges.outputs.go }}
      version_only: ${{ steps.versiononly.outputs.version_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Detect Go-relevant changes
        id: gochanges
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          if git diff --name-only "$base"...HEAD | grep -qE '(\.go$|^go\.mod$|^go\.sum$|^\.github/workflows/go-test\.yml$|^scripts/ci-shared-state-proof\.sh$|^scripts/ci-test-summary\.py$|^tests/known-flaky\.txt$|^tests/ci/ci-test-summary\.test\.sh$|^scripts/ci-native-ssh\.sh$|^tests/comms_matrix/|^\.github/workflows/comms-matrix\.yml$|^sandbox/Dockerfile$|^\.github/scripts/version-only-diff\.sh$|^tests/ci/version-only-diff\.test\.sh$)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "No Go-relevant changes; passing the gate without running the suite."
          fi
      # The detector's own cases (a few throwaway git repos, under a second).
      # A broken detector fails this job, and with it the gate.
      - name: Self-test the version-only detector
        if: github.event_name == 'pull_request' && steps.gochanges.outputs.go == 'true'
        run: bash tests/ci/version-only-diff.test.sh
      - name: Detect a version-only release PR on a green base
        id: versiononly
        if: github.event_name == 'pull_request' && steps.gochanges.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          # HEAD is the PR merge commit (base + PR), so base..HEAD is exactly
          # what this run would test on top of the base tree.
          result=false
          detect=.github/scripts/version-only-diff.sh
          if version=$(bash "$detect" diff "$BASE_SHA" HEAD); then
            echo "Version-only diff: $version"
            if gh api "repos/$REPO/actions/workflows/go-test.yml/runs?head_sha=$BASE_SHA&event=push&branch=main&per_page=20" > "$RUNNER_TEMP/runs.json" \
              && run_id=$(bash "$detect" pick-run "$RUNNER_TEMP/runs.json" "$BASE_SHA" "$REPO") \
              && gh api "repos/$REPO/actions/runs/$run_id/jobs?per_page=100" > "$RUNNER_TEMP/jobs.json" \
              && shards=$(bash "$detect" shards-green "$RUNNER_TEMP/jobs.json"); then
              result=true
              echo "Base $BASE_SHA passed the full suite in https://github.com/$REPO/actions/runs/$run_id ($shards); skipping the shards."
              echo "Version-only release PR: base run https://github.com/$REPO/actions/runs/$run_id ($shards); shards skipped." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "version_only=$result" >> "$GITHUB_OUTPUT"

  # The suite, split by package group across runners (#2169). `go test`
  # already runs every package in its own process, so a split changes
  # nothing about what each package sees; it only lets the heavy groups
  # (cmd, session, ui) run side by side instead of one after another.
  # Every shard uses the exact release-gate invocation (same gotestsum
  # flags, -race, 20m per-package timeout, PERF_BUDGET_MULTIPLIER).
  shard:
    name: Test shard (${{ matrix.shard.name }})
    needs: changes
    if: needs.changes.outputs.go == 'true' && needs.changes.outputs.version_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # cmd/agent-deck alone takes ~9 min, so it is cut three ways by test
        # name; the other groups fit one runner each.
        shard:
          - name: cmd-a
            packages: ./cmd/...
            run: '^Test[A-F]'
          - name: cmd-b
            packages: ./cmd/...
            run: '^Test[G-R]'
          - name: cmd-c
            packages: ./cmd/...
            run: '^Test[S-Z_a-z0-9]'
          - name: session
            packages: ./internal/session/...
          - name: ui-web
            packages: ./internal/ui/... ./internal/web/... ./tests/...
          - name: rest
            packages: REST
          # The shared-state ordering proof (scripts/ci-shared-state-proof.sh)
          # runs beside the shards instead of after them.
          - name: proof
            packages: PROOF
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      # tmux + zoxide back the session and quick-open picker tests that the
      # suite exercises for real; mirror release.yml.
      - name: Install tmux and zoxide
        timeout-minutes: 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux zoxide
          tmux -V
          zoxide --version

      - name: Resolve packages
        id: pkgs
        run: |
          if [ "${{ matrix.shard.packages }}" = "REST" ]; then
            pkgs=$(go list ./... | grep -vE '/cmd/|/internal/session|/internal/ui|/internal/web|/tests/' | tr '\n' ' ')
          elif [ "${{ matrix.shard.packages }}" = "PROOF" ]; then
            pkgs="PROOF"
          else
            pkgs="${{ matrix.shard.packages }}"
          fi
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          echo "$pkgs" | tr ' ' '\n'

      - name: Run tests
        timeout-minutes: 30
        env:
          PERF_BUDGET_MULTIPLIER: '2.0'
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          if [ "${{ matrix.shard.packages }}" = "PROOF" ]; then
            bash scripts/ci-shared-state-proof.sh
          elif [ -n "${{ matrix.shard.run }}" ]; then
            gotestsum --rerun-fails=2 --rerun-fails-abort-on-data-race --jsonfile test-output.json --packages="${{ steps.pkgs.outputs.packages }}" -- -race -timeout 20m -run '${{ matrix.shard.run }}'
          else
            gotestsum --rerun-fails=2 --rerun-fails-abort-on-data-race --jsonfile test-output.json --packages="${{ steps.pkgs.outputs.packages }}" -- -race -timeout 20m
          fi

      # Name the failing tests in the job summary (#2133) so a red shard says
      # whether it was a known flake or a real break, with the exact repro
      # line. Reads only the JSON above; never changes the job's result. The
      # PROOF shard runs a shell script, not gotestsum, so it has no JSON to
      # summarise.
      - name: Summarise failing tests
        if: always() && matrix.shard.packages != 'PROOF'
        run: |
          bash tests/ci/ci-test-summary.test.sh
          python3 scripts/ci-test-summary.py --json test-output.json --known-flaky tests/known-flaky.txt

      - name: Upload gotestsum JSON
        if: always() && matrix.shard.packages != 'PROOF'
        uses: actions/upload-artifact@v7
        with:
          name: go-test-output-${{ matrix.shard.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-output.json
          retention-days: 7
          if-no-files-found: ignore

  # Version-only release PRs (see the changes job): the base tree already
  # passed every shard, so this checks what the diff can break: the binary
  # builds and vets, reports the new Version, the changelog has its heading,
  # and the version, release-readiness and toolchain-pin tests pass.
  version-only:
    name: Version-only release check
    needs: changes
    if: needs.changes.outputs.version_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: go.mod

      - name: Build, vet and check the version
        run: |
          go build -o "$RUNNER_TEMP/agent-deck" ./cmd/agent-deck
          go vet ./cmd/agent-deck ./scripts
          want=$(sed -n 's/^var Version = "\([0-9][0-9.]*\)".*/\1/p' cmd/agent-deck/main.go)
          mkdir -p "$RUNNER_TEMP/home" "$RUNNER_TEMP/cache"
          got=$(HOME="$RUNNER_TEMP/home" XDG_CACHE_HOME="$RUNNER_TEMP/cache" "$RUNNER_TEMP/agent-deck" version </dev/null)
          echo "main.go: $want; binary: $got"
          [ "$got" = "Agent Deck v$want" ] || { echo "binary reports '$got', want 'Agent Deck v$want'"; exit 1; }
          grep -F "## [$want]" CHANGELOG.md >/dev/null || { echo "CHANGELOG.md has no '## [$want]' heading"; exit 1; }

      - name: Run the version and release tests
        timeout-minutes: 10
        env:
          PERF_BUDGET_MULTIPLIER: '2.0'
        run: |
          go install gotest.tools/gotestsum@v1.13.0
          gotestsum --rerun-fails=2 --rerun-fails-abort-on-data-race --jsonfile test-output.json --packages="./cmd/agent-deck ./scripts" -- -race -timeout 20m -run '^(TestVersionOutput_|TestParseAgentDeckVersion|TestRemoteVersionJSON_|TestReleaseReadiness_|TestGotestsumVersionAgreement|TestGolangciLintVersionAgreement)'

  # The single required context the main ruleset names. It passes when the
  # diff is not Go-relevant, when a version-only release PR passed its
  # version check, or when every Go shard passed. It fails (and never
  # skips) otherwise, so a docs-only PR still reports. It also fails when
  # the changes job itself did not succeed, so a broken detector never
  # reads as "not Go-relevant". The comms matrix is advisory and
  # deliberately does not feed this gate.
  full-test-suite:
    name: Full test suite (PR gate)
    needs: [changes, shard, version-only]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on shard results
        run: |
          echo "changes: ${{ needs.changes.result }}"
          echo "go-relevant: ${{ needs.changes.outputs.go }}"
          echo "version-only: ${{ needs.changes.outputs.version_only }} (${{ needs.version-only.result }})"
          echo "shards: ${{ needs.shard.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change detection did not succeed."; exit 1
          fi
          if [ "${{ needs.changes.outputs.go }}" != "true" ]; then
            echo "No Go-relevant changes; gate passes."; exit 0
          fi
          if [ "${{ needs.changes.outputs.version_only }}" = "true" ]; then
            if [ "${{ needs.version-only.result }}" = "success" ]; then
              echo "Version-only release PR on a green base; version check passed."; exit 0
            fi
            echo "Version-only release check failed or was cancelled."; exit 1
          fi
          if [ "${{ needs.shard.result }}" = "success" ]; then
            echo "All shards passed."; exit 0
          fi
          echo "A shard failed or was cancelled."; exit 1


  native-ssh:
    name: Required native SSH acceptance
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NATIVE_SSH_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.NATIVE_SSH_EXPECTED_SHA }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Set native evidence path
        run: echo "NATIVE_SSH_ARTIFACT_DIR=$RUNNER_TEMP/native-ssh-evidence" >> "$GITHUB_ENV"
      - name: Install real SSH fixture tools
        run: |
          mkdir -p "$NATIVE_SSH_ARTIFACT_DIR"
          id | tee "$NATIVE_SSH_ARTIFACT_DIR/runner-user.txt"
          sudo apt-get update -qq 2>&1 | tee "$NATIVE_SSH_ARTIFACT_DIR/apt-update.log"
          sudo apt-get install -y --no-install-recommends openssh-server openssh-client tmux python3 2>&1 | tee "$NATIVE_SSH_ARTIFACT_DIR/apt-install.log"
          dpkg-query -W openssh-server openssh-client tmux python3 > "$NATIVE_SSH_ARTIFACT_DIR/packages.txt"
      - name: Require real native SSH execution
        timeout-minutes: 18
        run: bash scripts/ci-native-ssh.sh
      - name: Retain native SSH evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-ssh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_SSH_ARTIFACT_DIR }}
          if-no-files-found: error


  native-ssh-macos:
    name: Required macOS native SSH acceptance
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      NATIVE_SSH_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ env.NATIVE_SSH_EXPECTED_SHA }}
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Prepare disposable runner tools and evidence
        run: |
          evidence=$(python3 -c 'import os; print(os.path.realpath(os.environ["RUNNER_TEMP"]) + "/native-ssh-macos-evidence")')
          mkdir "$evidence"
          echo "NATIVE_SSH_ARTIFACT_DIR=$evidence" >> "$GITHUB_ENV"
          id > "$evidence/runner-user.txt"
          sw_vers > "$evidence/os.txt"
          uname -m >> "$evidence/os.txt"
          if ! command -v tmux; then brew install tmux; fi
          tmux -V > "$evidence/tmux-version.txt"
          command -v tmux > "$evidence/tmux-path.txt"
      - name: Require real native SSH execution
        timeout-minutes: 20
        run: bash scripts/ci-native-ssh.sh
      - name: Retain macOS native SSH evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-ssh-macos-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.NATIVE_SSH_ARTIFACT_DIR }}
          if-no-files-found: error
